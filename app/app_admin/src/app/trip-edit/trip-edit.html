
<div class="card shadow-sm mt-4">
  <div class="card-header bg-dark text-white">
    <h4 class="mb-0">Edit Trip</h4>
  </div>

  <div class="card-body">
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form *ngIf="trip" (ngSubmit)="saveTrip()">

      <div class="mb-3">
        <label class="form-label">Trip Code</label>
        <input
          type="text"
          class="form-control"
          name="code"
          [(ngModel)]="trip.code"
          required
          readonly
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Trip Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          [(ngModel)]="trip.name"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Resort</label>
        <input
          type="text"
          class="form-control"
          name="resort"
          [(ngModel)]="trip.resort"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Duration</label>
        <input
          type="text"
          class="form-control"
          name="length"
          [(ngModel)]="trip.length"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input
          type="text"
          class="form-control"
          name="start"
          [(ngModel)]="trip.start"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Price Per Person</label>
        <input
          type="text"
          class="form-control"
          name="perPerson"
          [(ngModel)]="trip.perPerson"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Image Filename</label>
        <input
          type="text"
          class="form-control"
          name="image"
          [(ngModel)]="trip.image"
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea
          class="form-control"
          name="description"
          [(ngModel)]="trip.description"
          rows="4"
          required
        ></textarea>
      </div>

      <div class="d-flex gap-2">
        <button
          type="submit"
          class="btn btn-success"
          [disabled]="saving"
        >
          {{ saving ? 'Saving...' : 'Update Trip' }}
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </div>

    </form>
  </div>
</div>
