<div class="container mt-4">
  <h1 class="text-center mb-4">Travlr Getaways Admin</h1>

  <app-login *ngIf="!isLoggedIn"></app-login>

  <div *ngIf="isLoggedIn">
    <div class="text-end mb-3">
      <button class="btn btn-danger" (click)="logout()">
        Log Out
      </button>
    </div>

    <app-trip-list></app-trip-list>
  </div>
</div>
